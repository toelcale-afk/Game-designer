name: Build PackFlow Studio

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-packflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Robolectric needs Java 21 for its Android 16 (API 36) sandbox.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The debug keystore is created once and committed to keystore/ so every
      # build (CI and local) signs with the same key and installs update in place.
      - name: Create shared debug keystore (first run only)
        run: |
          if [ ! -f keystore/debug.keystore ]; then
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f keystore/debug.keystore
            git commit -m "Add shared debug keystore (created by CI)"
            if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
              # Another run committed one first: use that one instead.
              git fetch origin "${GITHUB_REF_NAME}"
              git checkout "origin/${GITHUB_REF_NAME}" -- keystore/debug.keystore || true
            fi
          fi
          # app/build.gradle.kts reads ${rootDir}/debug.keystore (AI Studio config, left untouched).
          cp keystore/debug.keystore debug.keystore

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Phase 4: the WebView shell for the offline quick build is built first and bundled
      # into PackFlow's assets (never committed).
      - name: Build quick-build shell
        run: |
          gradle --no-configuration-cache :shell:assembleRelease
          mkdir -p app/src/main/assets/shell
          cp "$(find shell/build/outputs/apk/release -name '*.apk' | head -1)" app/src/main/assets/shell/webshell.apk
          ls -la app/src/main/assets/shell/

      - name: Unit tests
        run: gradle --no-configuration-cache testDebugUnitTest

      - name: Check quick-build output with aapt2 and apksigner
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/aapt2" dump badging app/build/quickbuild-test.apk | tee badging.txt | head -5
          grep -q "package: name='com.packflow.citest' versionCode='25' versionName='2.5'" badging.txt
          grep -q "application-label:'CI Test Game'" badging.txt
          "$BT/apksigner" verify --verbose app/build/quickbuild-test.apk

      - name: Build debug APK
        run: gradle --no-configuration-cache assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: packflow-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 3
